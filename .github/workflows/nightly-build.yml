name: 夜间构建

on:
  schedule:
    # 每天 UTC 0:00 运行 (北京时间 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  nightly-build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查是否有新提交
        id: check
        run: |
          # 获取过去24小时内的提交数量
	          COMMITS_TODAY=$(git log --since="24 hours ago" --oneline | wc -l)
	          echo "commits_count=$COMMITS_TODAY" >> $GITHUB_OUTPUT
	          if [ "$COMMITS_TODAY" -eq 0 ]; then
	            echo "过去 24 小时无提交，跳过构建"
	            echo "should_build=false" >> $GITHUB_OUTPUT
	          else
	            echo "过去 24 小时发现 $COMMITS_TODAY 个提交，开始构建"
	            echo "should_build=true" >> $GITHUB_OUTPUT
	          fi

      - name: 设置 Node.js
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        if: steps.check.outputs.should_build == 'true'
        run: npm ci

      - name: 获取版本与提交信息
        if: steps.check.outputs.should_build == 'true'
        id: info
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "date_compact=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

          # 根据触发方式生成不同的 tag 和标题
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIME_SUFFIX="-$(date +'%H%M%S')"
            echo "tag_suffix=$TIME_SUFFIX" >> $GITHUB_OUTPUT
            echo "build_type=手动构建" >> $GITHUB_OUTPUT
            echo "datetime=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          else
            echo "tag_suffix=" >> $GITHUB_OUTPUT
            echo "build_type=夜间构建" >> $GITHUB_OUTPUT
            echo "datetime=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

          # 获取过去24小时内的提交信息
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          git log --since="24 hours ago" --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 生成发布包
        if: steps.check.outputs.should_build == 'true'
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh --browser chrome --output "Sapling-nightly-chrome-${{ steps.info.outputs.date_compact }}${{ steps.info.outputs.tag_suffix }}.zip"
          ./scripts/package.sh --browser firefox --output "Sapling-nightly-firefox-${{ steps.info.outputs.date_compact }}${{ steps.info.outputs.tag_suffix }}.zip"
          ./scripts/package.sh --browser edge --output "Sapling-nightly-edge-${{ steps.info.outputs.date_compact }}${{ steps.info.outputs.tag_suffix }}.zip"

      - name: 创建夜间发布
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{ steps.info.outputs.date_compact }}${{ steps.info.outputs.tag_suffix }}
          name: ${{ steps.info.outputs.build_type }} ${{ steps.info.outputs.date }}
          body: |
            **${{ steps.info.outputs.build_type }}** - ${{ steps.info.outputs.datetime }}
            **版本:** ${{ steps.info.outputs.version }}
            **最新提交:** ${{ steps.info.outputs.short_sha }}

            ## 过去 24 小时变更
            ${{ steps.info.outputs.commits }}

            ## 安装方法（开发者模式）
            - Chrome: 下载 `Sapling-nightly-chrome-${{ steps.info.outputs.date_compact }}${{ steps.info.outputs.tag_suffix }}.zip`，解压后在 `chrome://extensions/` 加载“已解压的扩展程序”
            - Edge: 下载 `Sapling-nightly-edge-${{ steps.info.outputs.date_compact }}${{ steps.info.outputs.tag_suffix }}.zip`，解压后在 `edge://extensions/` 加载“加载解压缩的扩展”
            - Firefox: 下载 `Sapling-nightly-firefox-${{ steps.info.outputs.date_compact }}${{ steps.info.outputs.tag_suffix }}.zip`，解压后在 `about:debugging#/runtime/this-firefox` 临时加载 `manifest.json`

            ---
            ⚠️ 自动夜间构建，可能不稳定。
          files: release/*.zip
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
