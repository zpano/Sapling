name: 正式发布

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 从 tag 提取版本号
        id: version
        run: |
          # 去掉 tag 的 'v' 前缀（例如：v1.0.0 -> 1.0.0）
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: 生成发布包
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh --browser chrome --output "Sapling-${{ steps.version.outputs.version }}-chrome.zip"
          ./scripts/package.sh --browser firefox --output "Sapling-${{ steps.version.outputs.version }}-firefox.zip"
          ./scripts/package.sh --browser edge --output "Sapling-${{ steps.version.outputs.version }}-edge.zip"

      - name: 创建发布
        uses: softprops/action-gh-release@v1
        with:
          name: Sapling v${{ steps.version.outputs.version }}
          body: |
            ## Sapling v${{ steps.version.outputs.version }}

            **发布时间:** ${{ steps.version.outputs.timestamp }}

            ### 安装方法
            - Chrome: 下载 `Sapling-${{ steps.version.outputs.version }}-chrome.zip`，解压后在 `chrome://extensions/` 加载“已解压的扩展程序”
            - Edge: 下载 `Sapling-${{ steps.version.outputs.version }}-edge.zip`，解压后在 `edge://extensions/` 加载“加载解压缩的扩展”
            - Firefox: 下载 `Sapling-${{ steps.version.outputs.version }}-firefox.zip`，解压后在 `about:debugging#/runtime/this-firefox` 临时加载 `manifest.json`

            ### 更新日志
            请查看下方的 commits 历史了解详细变更。

            ---

            **完整功能说明**: https://github.com/zpano/Sapling#readme
          files: release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
