name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: |
          # Strip leading 'v' from the tag (e.g. v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh --browser chrome --output "Sapling-${{ steps.version.outputs.version }}-chrome.zip"
          ./scripts/package.sh --browser firefox --output "Sapling-${{ steps.version.outputs.version }}-firefox.zip"
          ./scripts/package.sh --browser edge --output "Sapling-${{ steps.version.outputs.version }}-edge.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Sapling v${{ steps.version.outputs.version }}
          body: |
            ## Sapling v${{ steps.version.outputs.version }}

            **Published at:** ${{ steps.version.outputs.timestamp }} UTC

            ### Installation (Developer Mode)
            - Chrome: Download `Sapling-${{ steps.version.outputs.version }}-chrome.zip`, unzip, then load unpacked at `chrome://extensions/`
            - Edge: Download `Sapling-${{ steps.version.outputs.version }}-edge.zip`, unzip, then load unpacked at `edge://extensions/`
            - Firefox: Download `Sapling-${{ steps.version.outputs.version }}-firefox.zip`, unzip, then temporarily load `manifest.json` at `about:debugging#/runtime/this-firefox`

            ### Changelog
            See the commits history below for detailed changes.

            ---

            **Full documentation**: https://github.com/zpano/Sapling#readme
          files: release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
